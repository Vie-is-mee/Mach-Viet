<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1A1E" />
      <stop offset="50%" stop-color="#1E1719" />
      <stop offset="100%" stop-color="#120E10" />
    </linearGradient>
    <radialGradient id="stageLight" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F2E6D0" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#8B2626" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Robe Silk Gradients (Deep Royal Imperial Navy/Teal Silk) -->
    <linearGradient id="robeSilk" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#244B5C" />
      <stop offset="25%" stop-color="#1B3847" />
      <stop offset="60%" stop-color="#132733" />
      <stop offset="100%" stop-color="#0B171F" />
    </linearGradient>

    <linearGradient id="robeHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3D758E" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#244B5C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0E1E26" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="sleeveFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B171F" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#28566B" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#122733" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#081014" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Collar & Lining (Crisp White/Ivory Silk) -->
    <linearGradient id="whiteCollar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F3EFE6" />
      <stop offset="100%" stop-color="#DCD6C8" />
    </linearGradient>

    <!-- Gold Brass Buttons & Accents -->
    <linearGradient id="goldButton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#D4A054" />
      <stop offset="100%" stop-color="#8C6226" />
    </linearGradient>

    <!-- Silk Trouser Gradient -->
    <linearGradient id="trouserSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#E8E2D5" />
      <stop offset="100%" stop-color="#C5BEB0" />
    </linearGradient>

    <!-- Filter for soft cloth shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <circle cx="400" cy="225" r="320" fill="url(#stageLight)" />

  <!-- Subtle Heritage Floral Pattern Watermark in Background -->
  <g opacity="0.04" stroke="#D4A054" stroke-width="1.5" fill="none">
    <circle cx="400" cy="225" r="160" stroke-dasharray="8 6" />
    <circle cx="400" cy="225" r="210" stroke-dasharray="4 8" />
    <circle cx="400" cy="225" r="260" />
    <!-- Traditional Lotus/Cloud Petals -->
    <path d="M400,65 C430,120 460,180 400,225 C340,180 370,120 400,65 Z" />
    <path d="M400,385 C430,330 460,270 400,225 C340,270 370,330 400,385 Z" />
    <path d="M240,225 C295,195 355,165 400,225 C355,285 295,255 240,225 Z" />
    <path d="M560,225 C505,195 445,165 400,225 C445,285 505,255 560,225 Z" />
  </g>

  <!-- Outer Traditional Architectural Vignette Frames -->
  <rect x="24" y="24" width="752" height="402" rx="4" fill="none" stroke="#D4A054" stroke-opacity="0.2" stroke-width="1" />
  <rect x="30" y="30" width="740" height="390" rx="2" fill="none" stroke="#FAF7F2" stroke-opacity="0.07" stroke-width="0.75" />
  <!-- Corner Ornaments -->
  <path d="M24,44 L44,44 L44,24" fill="none" stroke="#D4A054" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M776,44 L756,44 L756,24" fill="none" stroke="#D4A054" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M24,406 L44,406 L44,426" fill="none" stroke="#D4A054" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M776,406 L756,406 L756,426" fill="none" stroke="#D4A054" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- MANNEQUIN / SILHOUETTE OF ÁO TẤC (NGŨ THÂN TAY THỤNG) -->
  <g filter="url(#softShadow)">
    <!-- Silk Trousers (Quần lụa trắng buông dài) -->
    <path d="M362,320 L350,420 L382,422 L394,330 Z" fill="url(#trouserSilk)" opacity="0.95" />
    <path d="M406,330 L418,422 L450,420 L438,320 Z" fill="url(#trouserSilk)" opacity="0.9" />
    <!-- Trouser folds shadow -->
    <path d="M370,340 L366,420" stroke="#B8B0A2" stroke-width="2" opacity="0.4" />
    <path d="M430,340 L434,420" stroke="#B8B0A2" stroke-width="2" opacity="0.4" />

    <!-- Main Robe Lower Body (Thân áo ngũ thân dài quá gối, vạt cong cánh cung) -->
    <path d="M330,220 L305,360 C305,372 345,378 400,378 C455,378 495,372 495,360 L470,220 Z" fill="url(#robeSilk)" />
    <!-- Lower Hem Shadow and Sheen -->
    <path d="M310,358 C350,374 450,374 490,358 C495,363 455,378 400,378 C345,378 305,363 310,358 Z" fill="#0E1D26" />
    <!-- Subtle gold thread hem border -->
    <path d="M308,358 C350,374 450,374 492,358" fill="none" stroke="#D4A054" stroke-width="1.2" opacity="0.5" />

    <!-- GIANT FLOWING SLEEVES (TAY THỤNG ĐẶC TRƯNG) - RIGHT & LEFT SPREAD -->
    <!-- Left Sleeve (Side view expanding wide) -->
    <path d="M330,125 C280,140 220,175 190,220 C182,232 195,300 240,310 C270,316 325,270 338,245 Z" fill="url(#robeSilk)" />
    <path d="M190,220 C210,270 250,305 285,308 C250,300 220,265 205,225 Z" fill="url(#sleeveFold)" />
    <!-- Left Sleeve Hem Border (Viền ống tay thụng rộng 1 tấc) -->
    <path d="M190,220 C195,260 215,295 240,310" fill="none" stroke="#3D758E" stroke-width="3" opacity="0.7" />
    <path d="M190,220 C195,260 215,295 240,310" fill="none" stroke="#D4A054" stroke-width="1.5" opacity="0.6" />

    <!-- Right Sleeve (Side view expanding wide) -->
    <path d="M470,125 C520,140 580,175 610,220 C618,232 605,300 560,310 C530,316 475,270 462,245 Z" fill="url(#robeSilk)" />
    <path d="M610,220 C590,270 550,305 515,308 C550,300 580,265 595,225 Z" fill="url(#sleeveFold)" />
    <!-- Right Sleeve Hem Border -->
    <path d="M610,220 C605,260 585,295 560,310" fill="none" stroke="#3D758E" stroke-width="3" opacity="0.7" />
    <path d="M610,220 C605,260 585,295 560,310" fill="none" stroke="#D4A054" stroke-width="1.5" opacity="0.6" />

    <!-- Chest & Forearms in Dignified Clasped Ceremony Pose (Khoanh tay trang nghiêm trước ngực) -->
    <!-- The two wide sleeves cross horizontally forming the stately rectangular silhouette of Áo Tấc -->
    <path d="M310,185 C310,185 360,250 400,250 C440,250 490,185 490,185 L465,270 C435,278 365,278 335,270 Z" fill="url(#robeHighlight)" />
    <path d="M325,195 C360,240 440,240 475,195 L460,255 C430,265 370,265 340,255 Z" fill="url(#sleeveFold)" />
    <!-- Center sleeve overlap fold (Nếp giao của 2 ống tay thụng) -->
    <path d="M340,242 C380,256 420,256 460,242" fill="none" stroke="#3D758E" stroke-width="2" opacity="0.8" />
    <path d="M350,254 C385,266 415,266 450,254" fill="none" stroke="#122733" stroke-width="2.5" opacity="0.9" />

    <!-- Main Upper Body Torso (Thân trước vạt lớn) -->
    <path d="M350,110 L320,195 L400,220 L480,195 L450,110 Z" fill="url(#robeSilk)" />

    <!-- Diagonal Button Flap (Hữu nhậm: Vạt cài khuy chéo sang nách phải) -->
    <path d="M400,105 C405,125 425,145 448,155 L455,195" fill="none" stroke="#10232E" stroke-width="3" />
    <path d="M400,105 C405,125 425,145 448,155 L455,195" fill="none" stroke="#D4A054" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />

    <!-- Five Golden Brass Buttons (5 cúc đồng/ngọc: Cổ, xương quai xanh, nách, sườn) -->
    <!-- Button 1 (Cổ) -->
    <circle cx="403" cy="107" r="3.5" fill="url(#goldButton)" stroke="#5A3E14" stroke-width="0.8" />
    <!-- Button 2 (Ngực trên) -->
    <circle cx="418" cy="125" r="3.5" fill="url(#goldButton)" stroke="#5A3E14" stroke-width="0.8" />
    <!-- Button 3 (Nách phải) -->
    <circle cx="438" cy="145" r="3.5" fill="url(#goldButton)" stroke="#5A3E14" stroke-width="0.8" />
    <!-- Button 4 (Sườn trên) -->
    <circle cx="452" cy="168" r="3.5" fill="url(#goldButton)" stroke="#5A3E14" stroke-width="0.8" />
    <!-- Button 5 (Hông) -->
    <circle cx="456" cy="192" r="3.5" fill="url(#goldButton)" stroke="#5A3E14" stroke-width="0.8" />

    <!-- Inner White Collar (Lớp lót cổ lập lĩnh trắng lộ ra đoan trang) -->
    <path d="M380,88 C388,78 412,78 420,88 L422,106 C412,110 388,110 378,106 Z" fill="url(#whiteCollar)" stroke="#C8C0B0" stroke-width="0.8" />

    <!-- Outer Standing Collar (Cổ đứng Lập Lĩnh xanh mực viền ngay ngắn) -->
    <path d="M382,90 C390,83 410,83 418,90 L421,108 C411,114 389,114 379,108 Z" fill="url(#robeSilk)" stroke="#3D758E" stroke-width="1" />
    <path d="M382,90 C390,83 410,83 418,90" fill="none" stroke="#D4A054" stroke-width="1.2" opacity="0.8" />

    <!-- Traditional Headgear: Khăn Đóng / Khăn Vấn xếp nếp đoan nghiêm -->
    <ellipse cx="400" cy="74" rx="28" ry="12" fill="#1A2830" stroke="#0E171C" stroke-width="1.5" />
    <path d="M374,74 C386,66 414,66 426,74 C426,80 414,84 400,84 C386,84 374,80 374,74 Z" fill="#243842" />
    <path d="M376,71 C388,64 412,64 424,71" fill="none" stroke="#D4A054" stroke-width="1" opacity="0.6" />
    <path d="M378,74 C390,68 410,68 422,74" fill="none" stroke="#FAF7F2" stroke-width="0.6" opacity="0.4" />
  </g>

  <!-- Editorial Info Banner at Bottom Left -->
  <g transform="translate(48, 360)">
    <!-- Cultural Era Tag -->
    <rect x="0" y="0" width="138" height="20" rx="2" fill="#8B2626" opacity="0.9" />
    <text x="8" y="14" font-family="'Be Vietnam Pro', sans-serif" font-size="9" font-weight="700" fill="#FAF7F2" letter-spacing="1">TRIỀU NGUYỄN · THẾ KỶ 19</text>

    <!-- Main Title -->
    <text x="0" y="42" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FAF7F2" letter-spacing="0.5">Áo Tấc (Ngũ Thân Tay Thụng)</text>
    <text x="0" y="58" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="400" fill="#D4A054" opacity="0.95">Lễ phục cổ truyền trang trọng · Ống tay thụng buông rủ uy nghi</text>
  </g>

  <!-- Authenticity Cultural Badge at Top Right -->
  <g transform="translate(640, 48)">
    <rect x="0" y="0" width="112" height="48" rx="2" fill="#000000" fill-opacity="0.5" stroke="#D4A054" stroke-width="0.75" />
    <text x="56" y="18" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="700" fill="#D4A054" letter-spacing="1.5">MẠCH VIỆT</text>
    <text x="56" y="32" text-anchor="middle" font-family="'Playfair Display', serif" font-size="11" font-weight="600" fill="#FAF7F2">Khảo Cứu Lễ Phục</text>
    <line x1="16" y1="38" x2="96" y2="38" stroke="#D4A054" stroke-width="0.5" opacity="0.5" />
  </g>
</svg>
